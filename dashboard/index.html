<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>mu-spec</title>
    <style>
/*palette*/
:root {
  --fallback-ground: #e4e7ec;
  --fallback-ink: #10141c;
  --fallback-panel: #fafbfc;
  --fallback-brand: #0e6e77;
  --fallback-brand-ink: #fafbfc;
  --fallback-panel-alt: #eff1f5;
  --fallback-ink-soft: #3d4654;
  --fallback-down: #b23a3a;
  --fallback-rule: #c7cdd8;
  --fallback-dim: #67707f;
  --fallback-ok: #2e7a57;
  --fallback-warn: #a9741b;
  --fallback-panel-3: #e8ebf0;
  --slice-1: #2f6f6b;
  --slice-2: #7a5cc4;
  --slice-3: #9a6b12;
  --slice-4: #2e7d4f;
  --slice-5: #a13a2c;
  --slice-6: #3a6ea5;
  --slice-7: #9c4f7c;
  --slice-8: #6b7a2f;
  --slice-9: #a5622c;
  --slice-10: #4a4f8c;
  --slice-none: #8a877f;
}
.dark {
  --fallback-ground: #0c1016;
  --fallback-ink: #e8ecf2;
  --fallback-panel: #141a22;
  --fallback-brand: #4cc2ce;
  --fallback-brand-ink: #0c1016;
  --fallback-panel-alt: #1a212b;
  --fallback-ink-soft: #b6c0ce;
  --fallback-down: #e06a6a;
  --fallback-rule: #262e3a;
  --fallback-dim: #7d8899;
  --fallback-ok: #4fb185;
  --fallback-warn: #d9a046;
  --fallback-panel-3: #1f2732;
  --slice-1: #86aba9;
  --slice-2: #b2a0dd;
  --slice-3: #c4a976;
  --slice-4: #86b499;
  --slice-5: #c88d85;
  --slice-6: #8dabcb;
  --slice-7: #c699b3;
  --slice-8: #a9b286;
  --slice-9: #cba485;
  --slice-10: #9699bc;
  --slice-none: #bbb9b5;
}
/*end palette*/
html {
  -webkit-text-size-adjust: 100%;
  tab-size: 4;
  line-height: 1.5;
  font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
*, ::before, ::after {
  box-sizing: border-box;
  border-color: var(--rule, var(--fallback-rule));
}
body {
  background: var(--ground, var(--fallback-ground));
  color: var(--ink, var(--fallback-ink));
  margin: 0;
}
    </style>
  </head>
  <body>
<!--bundle-->
  </body>
</html>
